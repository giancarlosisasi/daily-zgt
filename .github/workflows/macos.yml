name: macOS

on:
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - packages/design-tokens/**
      - .github/workflows/macos.yml
  pull_request:
    paths:
      - apps/macos/**
      - packages/design-tokens/**
      - .github/workflows/macos.yml

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check the generated tokens
        run: python3 packages/design-tokens/generate-tecla-tokens --check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate

      - name: Run the tests
        working-directory: apps/macos
        run: xcodebuild -project DailyZGT.xcodeproj -scheme DailyZGT -destination 'platform=macOS' -derivedDataPath build test
